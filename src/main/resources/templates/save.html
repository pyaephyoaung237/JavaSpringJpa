<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login</title>
<link rel="stylesheet" th:href="@{/css/navbar.css}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="d-flex align-items-center justify-content-center gap-3" style="margin-top:50px;">
  
  <img src="images/welcomeGif.gif" alt="Welcome" class="img-fluid" style="height:300px;">
  <div>
  <h1 >Hello, <span class="text-info" th:text="${userName}"></span> </h1>
  <h2>welcome</h2>
  <p class="fs-5 text-secondary">
    <i class="bi bi-cart3 me-2"></i> Shopping with Us!
  </p>
  <a th:href="@{/}" class="btn  btn-lg mt-3" style="background-color: #4b50b8; color: #fff;">
      Go to Shop
      <i class="bi bi-arrow-right-circle ms-2"></i>
    </a>
  
</div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</html>
