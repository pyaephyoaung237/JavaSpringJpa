<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Product</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">
  <h2 class="text-center mb-4">Add Product</h2>
  <form th:action="@{/admin/addProduct}" th:object="${product}" method="post" enctype="multipart/form-data">

    <div class="mb-3">
      <label class="form-label">Product Title</label>
      <input type="text" class="form-control" th:field="*{title}" placeholder="Enter product title">
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Enter product description"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Category</label>
      <select class="form-select" th:field="*{category}">
        <option disabled selected>Select category</option>
        <option th:value="Electronics">Electronics</option>
        <option th:value="Clothing">Clothing</option>
        <option th:value="Accessories">Accessories</option>
      </select>
    </div>

    <div class="row mb-3">
      <div class="col-md-4">
        <label class="form-label">Price</label>
        <input type="number" class="form-control" th:field="*{price}" placeholder="Enter price">
      </div>
      <div class="col-md-4">
        <label class="form-label">Stock</label>
        <input type="number" class="form-control" th:field="*{stock}" placeholder="Enter stock quantity">
      </div>
      <div class="col-md-4">
        <label class="form-label">Upload Image</label>
        <input type="file" class="form-control" th:field="*{image}">
      </div>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary">Add Product</button>
    </div>
  </form>
</div>


<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
