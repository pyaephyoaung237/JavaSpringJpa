<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Register</title>

<link rel="stylesheet" th:href="@{/css/navbar.css}">
<link rel="stylesheet" th:href="@{/css/register.css}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">


</head>

<body>



<div class="register-bg">
    <div class="register-box">

        <h4><i class="bi bi-person-plus"></i> Register</h4>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <input type="hidden" name="role" th:value="'user'">

            
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" th:field="*{fullName}" placeholder="Full Name" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Mobile Number</label>
                    <input type="text" class="form-control" th:field="*{mobile}" placeholder="Mobile">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" th:field="*{email}" placeholder="Email" required>
                </div>
            </div>

           
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control" th:field="*{address}" placeholder="Address">
                </div>

                <div class="col-md-4">
                    <label class="form-label">City</label>
                    <input type="text" class="form-control" th:field="*{city}" placeholder="City">
                </div>

                <div class="col-md-4">
                    <label class="form-label">State</label>
                    <input type="text" class="form-control" th:field="*{state}" placeholder="State">
                </div>
            </div>

            
            <div class="row mb-4">
                <div class="col-md-4">
                    <label class="form-label">Pincode</label>
                    <input type="text" class="form-control" th:field="*{pincode}" placeholder="Pincode">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" th:field="*{password}" placeholder="Password" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" name="confirmPassword" placeholder="Confirm Password" required>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn" style="background-color: #4b50b8; color: #fff;">Register</button>
            </div>

        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
