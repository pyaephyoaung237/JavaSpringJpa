<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login</title>
<link rel="stylesheet" th:href="@{/css/login.css}">
<link rel="stylesheet" th:href="@{/css/navbar.css}">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">



</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>


	<div class="login-bg">
		<div class="login-box">
			<h3 class="text-center mb-4">

				<img src="/images/circle.png" alt="User" class="me-2 user-icon">
				
			</h3>

			<form th:action="@{/userlogin}" th:object="${userLogin}"
				method="post">
				<div th:if="${error}" class="err" th:text="${error}">Invalid email or password</div>

				<div class="mb-3">
					<label class="form-label">Email Address</label> <input type="email"
						class="form-control" th:field="*{email}" placeholder="Enter email">
				</div>

				<div class="mb-3">
					<label class="form-label">Password</label> <input type="password"
						class="form-control" th:field="*{password}"
						placeholder="Enter password">
				</div>

				<button type="submit" class="btn  w-100 mt-2 "
					style="background-color: #4b50b8; color: #fff;">Login</button>
			</form>


			<div class="text-center mt-3">
				<span>Don't have an account? </span> <a th:href="@{/register}"
					class="text-decoration-none">Register</a>
			</div>


			<div class="icons mt-3">
				<a href="#"><i class="bi bi-facebook"></i></a> <a href="#"><i
					class="bi bi-twitter"></i></a> <a href="#"><i class="bi bi-google"></i></a>
				<a href="#"><i class="bi bi-instagram"></i></a> <a href="#"><i
					class="bi bi-linkedin"></i></a>
			</div>

		</div>
	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
