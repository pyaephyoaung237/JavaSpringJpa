<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

  .login-bg {
    background-image: url('images/shopping.jpg'); 
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 80px 0; 
    display: flex;
    justify-content: center;
    min-height: 80vh; 
    
  }

  .login-box {
    width: 350px;
    padding: 25px;
    background: rgba(255, 255, 255, 0.95); 
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.15);
  }

  .custom-nav {
    background-color: var(--bs-tertiary-bg);
  }
  .err {
  color: red;
  text-align: center;
  font-family:monospace;
  font-size: 17px;
}

</style>

</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="login-bg">
<div class="login-box">
  <h3 class="text-center mb-4">Login</h3>

  <form th:action="@{/userlogin}" th:object="${userLogin}" method="post">
    <div th:if="${error =='Invalid email or password' }" class="err">Invalid Email Or Password</div>
    <div class="mb-3">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-control" th:field="*{email}" placeholder="Enter email">
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" th:field="*{password}" placeholder="Enter password">
    </div>

    <button type="submit" class="btn btn-dark w-100 mt-2">Login</button>

  </form>
</div>
</div>
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
