<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link
	href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:wght@700&display=swap"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">


</head>
<body>

	<nav
		class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top"
		th:fragment="navbar">
		<div class="container-fluid">
			<a class="navbar-brand d-flex align-items-center" th:href="@{/}">
				<img th:src="@{/images/electric-guitar (1).png}" alt="Logo"
				height="27" width="35">
			</a>

			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarContent">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarContent">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item"><a class="nav-link text-dark"
						th:href="@{/}">Home</a></li>
					<li class="nav-item"><a class="nav-link text-dark"
						href="#product">Product</a></li>
					<li class="nav-item"><a class="nav-link text-dark"
						href="#about">About</a></li>
					<li class="nav-item"><a class="nav-link text-dark"
						href="#support">Service</a></li>
					<li class="nav-item"><a class="nav-link text-dark"
						href="#news">News</a></li>
				</ul>
				<form th:action="@{/search}" method="get" class="d-flex me-3"
					id="navbarSearchForm">
					<input class="form-control me-1" type="search"
						placeholder="Search products" aria-label="Search" name="query"
						th:value="${query}">
					<button class="btn btn-sm btn-custom" type="submit">
						<i class="bi bi-search"></i>
					</button>
				</form>

				<div class="d-flex align-items-center gap-2">

					<a th:href="@{/cart/view}"
						class="position-relative text-dark text-decoration-none me-2">
						<i class="bi bi-cart fs-4"></i> <span th:if="${cartCount > 0}"
						th:text="${cartCount}"
						class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
							0 </span>
					</a>


					<div>

						<a
							th:if="${session.LoginUser == null and session.LoginAdmin == null}"
							th:href="@{/userLogin}" class="btn btn-sm"
							style="background-color: #4b50b8; color: #fff;"> Login </a> <a
							th:if="${session.LoginUser != null }" th:href="@{/logout}"
							class="btn btn-sm"
							style="background-color: #4b50b8; color: #fff;"> Logout </a>
					</div>



					<div></div>



				</div>
			</div>
		</div>
	</nav>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		function toggleSearch() {
			const form = document.getElementById('navbarSearchForm');
			if (form.style.display === 'none' || form.style.display === '') {
				form.style.display = 'flex';
			} else {
				form.style.display = 'none';
			}
		}
	</script>
</body>
</html>
